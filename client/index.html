<!doctype html>

        <meta charset="UTF-8" />

        <title>TeaChoco Portfolio</title>
        <!--app-head-->
        <script>
            // Script to handle GitHub Pages SPA redirect
            (function (l) {
                if (l.search[1] === '/') {
                    var decoded = l.search
                        .slice(1)
                        .split('&')
                        .map(function (s) {
                            return s.replace(/~and~/g, '&');
                        })
                        .join('?');
                    window.history.replaceState(
                        null,
                        null,
                        l.pathname.slice(0, -1) + decoded + l.hash,
                    );
                }
            })(window.location);
        </script>
        <meta
            name="description"
            content="TeaChoco Portfolio - Developer Portfolio showcasing projects and skills"
        />
        <meta name="keywords" content="TeaChoco, Portfolio, Developer, Projects" />
        <meta name="author" content="TeaChoco" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="TeaChoco Portfolio" />
        <meta
            property="og:description"
            content="TeaChoco Portfolio - Developer Portfolio showcasing projects and skills"
        />
        <meta property="og:image" content="/vite.svg" />
